name: Verify translation overlay Android build

on:
  push:
    branches:
      - feature/overlay-background-controls
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out Android source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Compile and assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playtranslate-background-controls-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
