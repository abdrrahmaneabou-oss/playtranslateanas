name: Verify translation overlay Android build

on:
  push:
    branches:
      - feature/overlay-background-controls
      - feature/arm64-language-backup
      - feature/live-floating-style-dialogue-guard
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out Android source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "No Android sdkmanager in $SDK_ROOT"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Compile and assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify typography and dialogue-choice regressions
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "com.playtranslate.ui.TranslationFontGuardTest" \
            --tests "com.playtranslate.ocr.core.SpacedDialogueChoicesTest" \
            --no-daemon --stacktrace
      - name: Check ARM64-only APK libraries
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -Z -1 "$APK" | grep '^lib/arm64-v8a/' >/dev/null
          if unzip -Z -1 "$APK" | grep -q '^lib/armeabi-v7a/'; then
            echo "ERROR: 32-bit native libraries remain in APK"
            exit 1
          fi
          echo "ARM64 libraries present; no 32-bit native slice."
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playtranslate-background-controls-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
